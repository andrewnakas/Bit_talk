<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Bit_talk — Fully decentralized peer-to-peer vertical video sharing. No servers, no algorithms you can't see, no lock-in." />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Bit_talk" />
    <meta property="og:description" content="P2P video sharing. Open algorithm. No servers." />
    <meta property="og:type" content="website" />

    <title>Bit_talk</title>

    <!-- WebTorrent browser bundle — loaded from CDN to avoid Node.js bundling issues.
         This pre-built version handles all WebRTC/browser compatibility shims. -->
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@2.6.0/webtorrent.min.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Loading state shown before Svelte mounts -->
      <div style="
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        height:100dvh;
        background:#0a0a0a;
        color:#fff;
        font-family:system-ui,sans-serif;
        gap:1rem;
      ">
        <div style="font-size:2rem;font-weight:700;letter-spacing:-0.04em;">Bit_talk</div>
        <div style="width:2rem;height:2rem;border:2px solid #333;border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
